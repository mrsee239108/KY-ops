<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安全中心</title>
  <link rel="stylesheet" href="/static/css/security_center.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  {#    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>#}
    <script src="https://fastly.jsdelivr.net/npm/chart.js"></script>
  <script src="/static/js/theme-manager.js"></script>
</head>
<body>
  <div class="security-center">
    <!-- 标题栏 -->
    <div class="title-bar">
      <div class="title-bar-left">
        <i class="fas fa-shield-alt"></i>
        <span>安全中心</span>
      </div>
      <div class="title-bar-right">
        <div class="window-controls">
          <button class="control-btn theme-toggle" onclick="toggleTheme()" title="切换主题">
            <i class="fas fa-moon" id="themeIcon"></i>
          </button>
          <button class="control-btn refresh" onclick="refreshPage()" title="刷新"><i class="fas fa-sync-alt"></i></button>
          <button class="control-btn back" onclick="goBack()" title="返回"><i class="fas fa-arrow-left"></i></button>
        </div>
      </div>
    </div>

    <div class="security-content">
      <div class="main-content">
      <div class="tabs">
        <button class="tab-btn active" data-target="tab-logs">日志扫描异常分析</button>
        <button class="tab-btn" data-target="tab-predict">异常预测</button>
        <button class="tab-btn" data-target="tab-scripts">自动运维脚本</button>
      </div>

      <div id="tab-logs" class="tab-content active">
        <div class="overview">
          <div class="overview-card">
            <div class="label">今日处理日志</div>
            <div class="value info" id="todayLogs">--</div>
          </div>
          <div class="overview-card">
            <div class="label">今日异常</div>
            <div class="value warn" id="todayAnomalies">--</div>
          </div>
          <div class="overview-card">
            <div class="label">告警等级</div>
            <div class="value danger" id="riskLevel">--</div>
          </div>
          <div class="overview-card">
            <div class="label">监控状态</div>
            <div class="value" id="monitorStatus">运行中</div>
          </div>
        </div>

        <div class="module-grid">
          <div class="module-card">
            <div class="module-header">
              <h3>实时日志流</h3>
              <div>
                <label class="checkbox-label" style="margin-right: 10px;">
                  <input type="checkbox" id="autoRepairToggle">
                  <span>启用自动修复</span>
                </label>
                <button class="btn btn-sm" id="btnStartScan">启动扫描</button>
                <button class="btn btn-sm" id="btnExportAnomalies">导出异常</button>
                <button class="btn btn-sm" id="btnViewRepairs" style="display:none;">查看修复</button>
              </div>
            </div>
            <div class="log-stream" id="logStream"></div>
          </div>

          <div class="module-card">
            <div class="module-header">
              <h3>异常列表</h3>
            </div>
            <div class="anomaly-list" id="anomalyList"></div>
          </div>

          <div class="module-card wide">
            <div class="module-header">
              <h3>日志级别分布</h3>
            </div>
            <div class="chart-area">
              <canvas id="logLevelChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-predict" class="tab-content">
        <div class="overview">
          <div class="overview-card">
            <div class="label">CPU</div>
            <div class="value info" id="cpuVal">--%</div>
          </div>
          <div class="overview-card">
            <div class="label">内存</div>
            <div class="value warn" id="memVal">--%</div>
          </div>
          <div class="overview-card">
            <div class="label">磁盘</div>
            <div class="value" id="diskVal">--%</div>
          </div>
          <div class="overview-card">
            <div class="label">网络</div>
            <div class="value" id="netVal">--</div>
          </div>
        </div>

        <div class="module-grid">
          <div class="module-card">
            <div class="module-header"><h3>CPU 使用率</h3></div>
            <div class="chart-area"><canvas id="cpuChart"></canvas></div>
          </div>
          <div class="module-card">
            <div class="module-header"><h3>内存使用率</h3></div>
            <div class="chart-area"><canvas id="memChart"></canvas></div>
          </div>
          <div class="module-card">
            <div class="module-header"><h3>磁盘使用率</h3></div>
            <div class="chart-area"><canvas id="diskChart"></canvas></div>
          </div>
          <div class="module-card">
            <div class="module-header"><h3>网络 I/O 指标</h3></div>
            <div class="chart-area"><canvas id="netChart"></canvas></div>
          </div>
          <div class="module-card wide">
            <div class="module-header"><h3>风险趋势</h3></div>
            <div class="chart-area"><canvas id="riskTrend"></canvas></div>
          </div>
        </div>
      </div>

      <div id="tab-scripts" class="tab-content">
        <div class="module-grid">
          <div class="module-card">
            <div class="module-header">
              <h3>脚本列表</h3>
              <div>
                <button class="btn btn-sm primary" id="btnNewScript">新建脚本</button>
              </div>
            </div>
            <div class="script-list" id="scriptList"></div>
          </div>
          <div class="module-card">
            <div class="module-header"><h3>执行日志</h3></div>
            <div class="execution-logs" id="executionLogs"></div>
          </div>
        </div>
      </div>
    </div>
    </div>
  </div>

  <!-- 日志扫描进度 -->
  <div class="modal" id="scanProgressModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>日志扫描进度</h3>
        <button class="modal-close" onclick="document.getElementById('scanProgressModal').classList.remove('show')">×</button>
      </div>
      <div class="modal-body">
        <div class="progress">
          <div class="progress-bar" id="scanProgressBar" style="width:0%"></div>
        </div>
        <div class="progress-info">
          <span>进度：<span id="scanProgressText">0%</span></span>
          <span id="scanCountInfo">已扫描：0 行 | 发现异常：0</span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="document.getElementById('scanProgressModal').classList.remove('show')">关闭</button>
      </div>
    </div>
  </div>

  <!-- 修复操作查看 -->
  <div class="modal" id="repairActionsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>自动修复操作历史</h3>
        <button class="modal-close" onclick="document.getElementById('repairActionsModal').classList.remove('show')">×</button>
      </div>
      <div class="modal-body">
        <div class="repair-actions-list" id="repairActionsList">
          <div class="no-data">暂无修复操作记录</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="document.getElementById('repairActionsModal').classList.remove('show')">关闭</button>
      </div>
    </div>
  </div>

  <!-- 脚本编辑器 -->
  <div class="modal" id="scriptEditorModal">
    <div class="modal-content large">
      <div class="modal-header">
        <h3 id="scriptEditorTitle">新建脚本</h3>
        <button class="modal-close" id="btnCloseEditor">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-field">
            <label>脚本名称</label>
            <input id="scriptName" placeholder="例如: cleanup_temp.sh" />
          </div>
          <div class="form-field">
            <label>脚本类型</label>
            <select id="scriptType" class="select">
              <option value="sh">Bash (.sh)</option>
              <option value="ps1">PowerShell (.ps1)</option>
              <option value="bat">Batch (.bat)</option>
              <option value="py">Python (.py)</option>
              <option value="js">Node.js (.js)</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field full">
            <label>脚本描述</label>
            <input id="scriptDesc" placeholder="脚本用途说明 (可选)" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field full">
            <label>脚本内容</label>
            <textarea id="scriptCode" rows="12" placeholder="# 在此编写脚本...\necho \"hello\""></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="btnSaveScript">保存</button>
        <button class="btn ghost" id="btnCloseEditor">取消</button>
      </div>
    </div>
  </div>

  <script src="/static/js/security_center.js"></script>
</body>
</html>
